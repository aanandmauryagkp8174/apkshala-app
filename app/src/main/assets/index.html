<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Balloon Pop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Inter,"Segoe UI",system-ui,sans-serif;
    background:#020817;
}

body{
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    isolation:isolate;
    background:
        radial-gradient(ellipse at 50% 5%,rgba(87,177,255,.34),transparent 58%),
        radial-gradient(ellipse at 15% 80%,rgba(70,170,255,.16),transparent 45%),
        radial-gradient(ellipse at 85% 70%,rgba(132,91,255,.14),transparent 42%),
        linear-gradient(180deg,#020817 0%,#06152c 20%,#0a2750 48%,#0d3c61 72%,#092d4b 100%);
}

.sky-glow{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 50% 35%,rgba(119,205,255,.13),transparent 35%),
        linear-gradient(180deg,transparent 45%,rgba(41,156,221,.06) 68%,rgba(0,0,0,.27) 100%);
    z-index:0;
}

.sky-glow:after{
    content:"";
    position:absolute;
    left:50%;
    bottom:0;
    width:130%;
    height:38%;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center bottom,rgba(50,184,255,.18),transparent 65%);
    filter:blur(20px);
}

.moon{
    position:absolute;
    width:clamp(62px,12vw,105px);
    height:clamp(62px,12vw,105px);
    top:11%;
    right:8%;
    border-radius:50%;
    background:radial-gradient(circle at 34% 29%,#fff 0%,#eaf8ff 38%,#b9ddf5 72%,#79b4db 100%);
    box-shadow:0 0 18px rgba(255,255,255,.55),0 0 55px rgba(119,207,255,.26);
    opacity:.9;
    z-index:1;
}

.moon:before,.moon:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(89,139,169,.12);
}

.moon:before{
    width:18%;
    height:18%;
    left:25%;
    top:30%;
}

.moon:after{
    width:25%;
    height:25%;
    right:19%;
    bottom:23%;
}

.cloud{
    position:absolute;
    width:210px;
    height:58px;
    border-radius:100px;
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.045));
    filter:blur(1px);
    opacity:.55;
    pointer-events:none;
    z-index:2;
}

.cloud:before,.cloud:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.045));
}

.cloud:before{
    width:92px;
    height:92px;
    left:28px;
    bottom:5px;
}

.cloud:after{
    width:110px;
    height:110px;
    right:22px;
    bottom:1px;
}

.cloud.one{
    left:-85px;
    top:25%;
    animation:cloud1 42s linear infinite;
}

.cloud.two{
    right:-100px;
    top:43%;
    transform:scale(1.15);
    opacity:.42;
    animation:cloud2 55s linear infinite;
}

.cloud.three{
    left:25%;
    top:60%;
    transform:scale(.62);
    opacity:.28;
    animation:cloud3 65s linear infinite;
}

@keyframes cloud1{
    0%,100%{transform:translateX(-20px)}
    50%{transform:translateX(120px)}
}

@keyframes cloud2{
    0%,100%{transform:translateX(30px) scale(1.15)}
    50%{transform:translateX(-130px) scale(1.1)}
}

@keyframes cloud3{
    0%,100%{transform:translateX(-70px) scale(.62)}
    50%{transform:translateX(100px) scale(.67)}
}

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 5px rgba(255,255,255,.8);
    animation:twinkle var(--speed,2.5s) ease-in-out infinite alternate;
}

.star:nth-child(3n){
    width:3px;
    height:3px;
}

@keyframes twinkle{
    from{opacity:.15;transform:scale(.7)}
    to{opacity:.9;transform:scale(1.45)}
}

#playArea{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:5;
}

.ground-glow{
    position:absolute;
    left:50%;
    bottom:-120px;
    width:125%;
    height:300px;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(48,191,255,.25),transparent 70%);
    filter:blur(8px);
    pointer-events:none;
    z-index:3;
}

/* HUD */

#hud{
    position:absolute;
    top:max(15px,env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    width:min(calc(100% - 26px),560px);
    display:flex;
    justify-content:space-between;
    gap:12px;
    z-index:100;
    pointer-events:none;
}

.hud-box{
    min-width:118px;
    padding:10px 18px 11px;
    border-radius:19px;
    text-align:center;
    color:#fff;
    background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.045));
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 10px 35px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.15);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
}

.hud-label{
    display:block;
    font-size:9px;
    font-weight:800;
    letter-spacing:2px;
    color:rgba(255,255,255,.58);
    margin-bottom:5px;
}

.hud-value{
    display:block;
    font-size:23px;
    font-weight:950;
    line-height:1;
}

/* BALLOONS */

.balloon{
    position:absolute;
    width:64px;
    height:76px;
    border-radius:50% 50% 48% 48% / 50% 50% 44% 44%;
    cursor:pointer;
    z-index:20;
    transform-origin:center bottom;
    box-shadow:
        inset -11px -15px 20px rgba(0,0,0,.22),
        inset 10px 8px 14px rgba(255,255,255,.34),
        0 13px 25px rgba(0,0,0,.2);
    will-change:transform,top;
}

.balloon:before{
    content:"";
    position:absolute;
    width:21px;
    height:31px;
    left:12px;
    top:8px;
    border-radius:60%;
    background:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.24) 45%,transparent 75%);
    transform:rotate(25deg);
}

.balloon:after{
    content:"";
    position:absolute;
    width:11px;
    height:9px;
    left:50%;
    bottom:-5px;
    transform:translateX(-50%);
    background:inherit;
    clip-path:polygon(0 0,100% 0,50% 100%);
}

.balloon-string{
    position:absolute;
    left:50%;
    top:calc(100% + 7px);
    width:1px;
    height:48px;
    background:linear-gradient(180deg,rgba(255,255,255,.58),rgba(255,255,255,.05));
}

.red{
    background:radial-gradient(circle at 32% 25%,#ffb0b9,#ff5b70 22%,#f3294c 50%,#bf1236 78%,#860c2b);
}

.blue{
    background:radial-gradient(circle at 32% 25%,#b9ecff,#55c6ff 23%,#168ff5 52%,#0758c7 78%,#063d91);
}

.yellow{
    background:radial-gradient(circle at 32% 25%,#fffbd0,#ffe75d 23%,#ffc21c 52%,#ee8c00 80%,#bd5d00);
}

.green{
    background:radial-gradient(circle at 32% 25%,#d3ffdf,#6bf19b 23%,#25cf69 52%,#07934a 80%,#056b36);
}

.purple{
    background:radial-gradient(circle at 32% 25%,#f0d5ff,#d18aff 23%,#a843ef 52%,#7021b8 80%,#45127a);
}

.pink{
    background:radial-gradient(circle at 32% 25%,#ffd4e9,#ff8bc2 23%,#ff4e9d 52%,#d91e70 80%,#99124e);
}

.orange{
    background:radial-gradient(circle at 32% 25%,#ffe1b7,#ffb45c 23%,#ff8129 52%,#e9510e 80%,#a72f08);
}

.cyan{
    background:radial-gradient(circle at 32% 25%,#d8ffff,#77f5f5 23%,#29d9df 52%,#079eb5 80%,#066f80);
}

/* POP EFFECTS */

.pop-particle{
    position:absolute;
    width:7px;
    height:7px;
    border-radius:50%;
    pointer-events:none;
    z-index:60;
    box-shadow:0 0 8px currentColor;
    animation:particle .56s cubic-bezier(.15,.8,.3,1) forwards;
}

@keyframes particle{
    0%{
        opacity:1;
        transform:translate(0,0) scale(1.2);
    }
    100%{
        opacity:0;
        transform:translate(var(--dx),var(--dy)) scale(.05) rotate(180deg);
    }
}

.pop-ring{
    position:absolute;
    width:16px;
    height:16px;
    border:3px solid #fff;
    border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:55;
    animation:ring .46s cubic-bezier(.15,.75,.2,1) forwards;
}

@keyframes ring{
    0%{opacity:1;width:12px;height:12px}
    100%{opacity:0;width:145px;height:145px}
}

.score-popup{
    position:absolute;
    color:#fff;
    font-size:25px;
    font-weight:950;
    text-shadow:0 2px 5px rgba(0,0,0,.45),0 0 14px rgba(255,255,255,.35);
    pointer-events:none;
    z-index:70;
    animation:scoreFloat .68s cubic-bezier(.2,.7,.2,1) forwards;
}

@keyframes scoreFloat{
    0%{
        opacity:0;
        transform:translate(-50%,0) scale(.45);
    }
    18%{
        opacity:1;
        transform:translate(-50%,-15px) scale(1.2);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-75px) scale(.92);
    }
}

/* START SCREEN */

#startScreen{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px 18px;
    background:
        radial-gradient(circle at 50% 42%,rgba(31,113,191,.34),transparent 48%),
        linear-gradient(180deg,rgba(1,8,20,.52),rgba(1,7,18,.88));
    backdrop-filter:blur(9px) saturate(120%);
    -webkit-backdrop-filter:blur(9px) saturate(120%);
}

.start-card{
    width:min(92vw,440px);
    padding:30px 25px 25px;
    border-radius:32px;
    text-align:center;
    color:#fff;
    background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.055));
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 35px 100px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter:blur(25px) saturate(145%);
    -webkit-backdrop-filter:blur(25px) saturate(145%);
}

.logo-balloon{
    position:relative;
    width:92px;
    height:108px;
    margin:2px auto 19px;
    border-radius:50% 50% 48% 48% / 50% 50% 44% 44%;
    background:radial-gradient(circle at 32% 24%,#fff5b0,#ffe35b 20%,#ffb51f 46%,#ff6c16 73%,#d62b0c);
    box-shadow:inset -15px -18px 26px rgba(0,0,0,.23),inset 12px 9px 17px rgba(255,255,255,.42),0 22px 45px rgba(255,106,24,.22);
    animation:heroFloat 2.8s ease-in-out infinite;
}

.logo-balloon:before{
    content:"";
    position:absolute;
    width:29px;
    height:42px;
    left:17px;
    top:11px;
    border-radius:60%;
    background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.24),transparent);
    transform:rotate(24deg);
}

@keyframes heroFloat{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-12px) rotate(2deg)}
}

.start-title{
    font-size:clamp(38px,10vw,56px);
    font-weight:950;
    letter-spacing:-2.8px;
    line-height:.9;
    margin-bottom:15px;
    background:linear-gradient(135deg,#fff,#d8f4ff 45%,#78ceff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.start-subtitle{
    color:rgba(255,255,255,.67);
    font-size:14px;
    line-height:1.55;
    margin:0 auto 20px;
    max-width:310px;
}

/* SPEED */

.speed-selector{
    width:100%;
    margin:0 auto 18px;
}

.speed-label{
    margin-bottom:8px;
    color:rgba(255,255,255,.52);
    font-size:9px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
}

.speed-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.speed-option{
    min-height:46px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.11);
    background:rgba(255,255,255,.055);
    color:rgba(255,255,255,.65);
    font-size:13px;
    font-weight:800;
    cursor:pointer;
    transition:.16s ease;
}

.speed-option:active{
    transform:scale(.96);
}

.speed-option.active{
    color:#fff;
    background:linear-gradient(135deg,rgba(48,171,255,.28),rgba(72,108,255,.18));
    border-color:rgba(92,201,255,.62);
    box-shadow:0 0 20px rgba(44,174,255,.13),inset 0 1px 0 rgba(255,255,255,.16);
}

/* BUTTON */

.start-button{
    position:relative;
    width:100%;
    min-height:61px;
    border:0;
    border-radius:19px;
    background:linear-gradient(135deg,#ff5476,#ff315c 45%,#ec1748);
    color:#fff;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 13px 35px rgba(255,44,87,.33),inset 0 1px 0 rgba(255,255,255,.38);
    overflow:hidden;
}

.start-button:active{
    transform:scale(.965);
}

.instructions{
    margin-top:18px;
    display:flex;
    justify-content:center;
    gap:5px;
    flex-wrap:wrap;
    color:rgba(255,255,255,.5);
    font-size:10px;
}

.instruction{
    padding:6px 8px;
    border-radius:10px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
}

/* GAME OVER */

#gameOver{
    position:absolute;
    inset:0;
    z-index:400;
    display:none;
    align-items:center;
    justify-content:center;
    padding:22px;
    background:rgba(1,7,18,.76);
    backdrop-filter:blur(11px);
}

.gameover-card{
    width:min(90vw,400px);
    padding:32px 24px 25px;
    text-align:center;
    border-radius:30px;
    color:#fff;
    background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 30px 90px rgba(0,0,0,.52);
    backdrop-filter:blur(24px);
}

.gameover-title{
    font-size:38px;
    font-weight:950;
}

.final-score{
    font-size:64px;
    font-weight:950;
    margin:14px 0 6px;
    background:linear-gradient(135deg,#fff,#71d1ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.final-label{
    color:rgba(255,255,255,.52);
    font-size:13px;
    margin-bottom:24px;
}

.restart-button{
    width:100%;
    min-height:56px;
    border:0;
    border-radius:17px;
    background:linear-gradient(135deg,#fff,#dff5ff);
    color:#0a2944;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

@media(max-width:500px){
    #hud{
        width:calc(100% - 20px);
        gap:8px;
    }

    .hud-box{
        min-width:96px;
        padding:9px 13px 10px;
        border-radius:16px;
    }

    .hud-value{
        font-size:20px;
    }

    .start-card{
        padding:27px 19px 22px;
        border-radius:28px;
    }

    .logo-balloon{
        width:78px;
        height:92px;
        margin-bottom:15px;
    }

    .start-title{
        font-size:42px;
    }

    .start-subtitle{
        font-size:13px;
    }

    .start-button{
        min-height:57px;
        font-size:17px;
    }

    .balloon{
        width:58px;
        height:70px;
    }
}

@media(max-height:650px){
    .start-card{
        padding-top:18px;
        padding-bottom:16px;
    }

    .logo-balloon{
        transform:scale(.75);
        margin-top:-12px;
        margin-bottom:-2px;
    }

    .start-title{
        font-size:35px;
        margin-bottom:8px;
    }

    .start-subtitle{
        margin-bottom:12px;
    }

    .instructions{
        margin-top:9px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="sky-glow"></div>
    <div class="moon"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>

    <div class="stars" id="stars"></div>

    <div id="playArea"></div>

    <div class="ground-glow"></div>

    <div id="hud">

        <div class="hud-box">
            <span class="hud-label">Score</span>
            <span class="hud-value" id="score">0</span>
        </div>

        <div class="hud-box">
            <span class="hud-label">Time</span>
            <span class="hud-value" id="timer">60</span>
        </div>

    </div>

    <!-- START -->

    <div id="startScreen">

        <div class="start-card">

            <div class="logo-balloon"></div>

            <div class="start-title">
                BALLOON<br>POP!
            </div>

            <div class="start-subtitle">
                Touch the colorful balloons
                and pop them before they
                fly away!
            </div>

            <div class="speed-selector">

                <div class="speed-label">
                    GAME SPEED
                </div>

                <div class="speed-options">

                    <button
                        class="speed-option active"
                        data-speed="normal"
                        type="button">
                        🐢 Normal
                    </button>

                    <button
                        class="speed-option"
                        data-speed="high"
                        type="button">
                        ⚡ High Speed
                    </button>

                </div>

            </div>

            <button
                class="start-button"
                id="startButton"
                type="button">
                ▶ START GAME
            </button>

            <div class="instructions">
                <div class="instruction">🎈 Pop balloons</div>
                <div class="instruction">💥 Make combos</div>
                <div class="instruction">🏆 Beat your score</div>
            </div>

        </div>

    </div>

    <!-- GAME OVER -->

    <div id="gameOver">

        <div class="gameover-card">

            <div class="gameover-title">
                Time's Up!
            </div>

            <div class="final-score" id="finalScore">
                0
            </div>

            <div class="final-label">
                balloons popped
            </div>

            <button
                class="restart-button"
                id="restartButton"
                type="button">
                🔄 PLAY AGAIN
            </button>

        </div>

    </div>

</div>

<script>
"use strict";

/* ELEMENTS */

const playArea=document.getElementById("playArea");
const startScreen=document.getElementById("startScreen");
const gameOver=document.getElementById("gameOver");
const startButton=document.getElementById("startButton");
const restartButton=document.getElementById("restartButton");
const scoreElement=document.getElementById("score");
const timerElement=document.getElementById("timer");
const finalScoreElement=document.getElementById("finalScore");
const stars=document.getElementById("stars");

/* STATE */

let score=0;
let timeLeft=60;
let gameRunning=false;
let timerInterval=null;
let spawnInterval=null;
let animationFrame=null;
let balloonId=0;
let activeBalloons=new Map();

let audioContext=null;
let masterGain=null;

let combo=0;
let lastPopTime=0;

let gameSpeed="normal";

/* COLORS */

const colors=[
    "red",
    "blue",
    "yellow",
    "green",
    "purple",
    "pink",
    "orange",
    "cyan"
];

/* RANDOM */

function random(min,max){
    return Math.random()*(max-min)+min;
}

function randomInt(min,max){
    return Math.floor(random(min,max+1));
}

/* STARS */

function createStars(){

    const count=window.innerWidth<500?42:70;

    for(let i=0;i<count;i++){

        const star=document.createElement("div");

        star.className="star";

        star.style.left=random(0,100)+"%";
        star.style.top=random(0,82)+"%";
        star.style.animationDelay=random(0,3)+"s";
        star.style.setProperty("--speed",random(1.8,4.5)+"s");

        stars.appendChild(star);
    }
}

createStars();

/* AUDIO */

function initAudio(){

    if(audioContext){

        if(audioContext.state==="suspended"){
            audioContext.resume();
        }

        return;
    }

    const AudioCtx=
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioCtx)return;

    audioContext=new AudioCtx();

    masterGain=
        audioContext.createGain();

    masterGain.gain.value=.72;

    masterGain.connect(
        audioContext.destination
    );
}

/* POP SOUND */

function playPopSound(){

    if(!audioContext)return;

    if(audioContext.state==="suspended"){
        audioContext.resume();
    }

    const now=audioContext.currentTime;

    /* SNAP */

    const osc=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();

    osc.type="square";

    osc.frequency.setValueAtTime(
        random(280,420),
        now
    );

    osc.frequency.exponentialRampToValueAtTime(
        random(65,95),
        now+.075
    );

    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .65,
        now+.004
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.09
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now+.1);

    /* AIR BURST */

    const bufferSize=
        Math.floor(
            audioContext.sampleRate*.18
        );

    const buffer=
        audioContext.createBuffer(
            1,
            bufferSize,
            audioContext.sampleRate
        );

    const data=
        buffer.getChannelData(0);

    for(let i=0;i<bufferSize;i++){

        const envelope=
            Math.pow(
                1-i/bufferSize,
                2.5
            );

        data[i]=
            (Math.random()*2-1)*
            envelope;
    }

    const noise=
        audioContext.createBufferSource();

    noise.buffer=buffer;

    const filter=
        audioContext.createBiquadFilter();

    filter.type="highpass";
    filter.frequency.value=900;

    const noiseGain=
        audioContext.createGain();

    noiseGain.gain.setValueAtTime(
        .0001,
        now
    );

    noiseGain.gain.exponentialRampToValueAtTime(
        .8,
        now+.003
    );

    noiseGain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.16
    );

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(masterGain);

    noise.start(now);

    /* CRACK */

    const crack=
        audioContext.createOscillator();

    const crackGain=
        audioContext.createGain();

    crack.type="triangle";

    crack.frequency.setValueAtTime(
        random(900,1300),
        now
    );

    crack.frequency.exponentialRampToValueAtTime(
        180,
        now+.055
    );

    crackGain.gain.setValueAtTime(
        .0001,
        now
    );

    crackGain.gain.exponentialRampToValueAtTime(
        .22,
        now+.002
    );

    crackGain.gain.exponentialRampToValueAtTime(
        .0001,
        now+.07
    );

    crack.connect(crackGain);
    crackGain.connect(masterGain);

    crack.start(now);
    crack.stop(now+.08);
}

/* CREATE BALLOON */

function createBalloon(){

    if(!gameRunning)return;

    const balloon=
        document.createElement("div");

    const color=
        colors[
            randomInt(0,colors.length-1)
        ];

    balloon.className=
        "balloon "+color;

    const id=++balloonId;

    balloon.dataset.id=id;

    const width=random(54,75);
    const height=width*random(1.10,1.22);

    balloon.style.width=width+"px";
    balloon.style.height=height+"px";

    const x=random(
        2,
        Math.max(
            2,
            window.innerWidth-width-2
        )
    );

    const startY=
        window.innerHeight+
        random(30,140);

    balloon.style.left=x+"px";
    balloon.style.top=startY+"px";

    const string=
        document.createElement("div");

    string.className="balloon-string";

    balloon.appendChild(string);
    playArea.appendChild(balloon);

    /* SPEED */

    const speed=
        gameSpeed==="high"
            ? random(85,145)
            : random(45,95);

    const drift=random(-28,28);
    const rotation=random(-5,5);
    const wobble=random(.8,1.8);
    const phase=random(0,Math.PI*2);

    const data={
        element:balloon,
        x:x,
        y:startY,
        speed:speed,
        drift:drift,
        rotation:rotation,
        wobble:wobble,
        phase:phase,
        popped:false,
        created:performance.now()
    };

    activeBalloons.set(id,data);

    balloon.addEventListener(
        "pointerdown",
        event=>{
            event.preventDefault();

            popBalloon(
                id,
                event.clientX,
                event.clientY
            );
        },
        {passive:false}
    );
}

/* POP */

function popBalloon(id){

    const data=
        activeBalloons.get(id);

    if(!data || data.popped)return;

    data.popped=true;

    const now=performance.now();

    if(now-lastPopTime<1200){
        combo++;
    }else{
        combo=1;
    }

    lastPopTime=now;

    const points=
        10+
        Math.min(
            20,
            (combo-1)*2
        );

    score+=points;

    scoreElement.textContent=score;

    const rect=
        data.element.getBoundingClientRect();

    const x=
        rect.left+
        rect.width/2;

    const y=
        rect.top+
        rect.height/2;

    playPopSound();

    const colorClass=
        data.element.className
        .split(" ")
        .find(c=>colors.includes(c));

    createPopEffect(
        x,
        y,
        colorClass
    );

    createScorePopup(
        x,
        y,
        points
    );

    data.element.remove();

    activeBalloons.delete(id);
}

/* POP EFFECT */

function createPopEffect(x,y,colorClass){

    const colorMap={
        red:"#ff4f68",
        blue:"#42a9ff",
        yellow:"#ffd438",
        green:"#32db79",
        purple:"#b65aff",
        pink:"#ff64ac",
        orange:"#ff983b",
        cyan:"#38e4e8"
    };

    const color=
        colorMap[colorClass]||
        "#ffffff";

    const ring=
        document.createElement("div");

    ring.className="pop-ring";

    ring.style.left=x+"px";
    ring.style.top=y+"px";
    ring.style.borderColor=color;

    playArea.appendChild(ring);

    setTimeout(
        ()=>ring.remove(),
        500
    );

    const count=randomInt(10,16);

    for(let i=0;i<count;i++){

        const particle=
            document.createElement("div");

        particle.className=
            "pop-particle";

        particle.style.left=x+"px";
        particle.style.top=y+"px";

        particle.style.background=color;
        particle.style.color=color;

        const angle=
            Math.random()*Math.PI*2;

        const distance=
            random(40,100);

        particle.style.setProperty(
            "--dx",
            Math.cos(angle)*distance+"px"
        );

        particle.style.setProperty(
            "--dy",
            Math.sin(angle)*distance+"px"
        );

        playArea.appendChild(particle);

        setTimeout(
            ()=>particle.remove(),
            600
        );
    }
}

/* SCORE */

function createScorePopup(x,y,points){

    const popup=
        document.createElement("div");

    popup.className="score-popup";

    popup.textContent="+"+points;

    popup.style.left=x+"px";
    popup.style.top=y+"px";

    playArea.appendChild(popup);

    setTimeout(
        ()=>popup.remove(),
        700
    );
}

/* GAME LOOP */

function gameLoop(timestamp){

    if(!gameRunning)return;

    const previous=
        gameLoop.lastTime||timestamp;

    const delta=
        Math.min(
            .04,
            (timestamp-previous)/1000
        );

    gameLoop.lastTime=timestamp;

    for(const [id,data] of activeBalloons){

        if(data.popped)continue;

        data.y-=data.speed*delta;

        const elapsed=
            (timestamp-data.created)/1000;

        const sway=
            Math.sin(
                elapsed*data.wobble+
                data.phase
            )*data.drift;

        const rotation=
            data.rotation+
            Math.sin(
                elapsed*data.wobble+
                data.phase
            )*4;

        data.element.style.transform=
            `translateX(${sway}px) rotate(${rotation}deg)`;

        data.element.style.top=
            data.y+"px";

        if(
            data.y<
            -data.element.offsetHeight-100
        ){

            data.element.remove();

            activeBalloons.delete(id);
        }
    }

    animationFrame=
        requestAnimationFrame(gameLoop);
}

/* SPAWNER */

function startSpawner(){

    clearInterval(spawnInterval);

    for(let i=0;i<5;i++){

        setTimeout(
            ()=>createBalloon(),
            i*180
        );
    }

    const spawnDelay=
        gameSpeed==="high"
            ? 430
            : 650;

    spawnInterval=
        setInterval(
            ()=>{

                if(!gameRunning)return;

                createBalloon();

                if(
                    gameSpeed==="high" &&
                    Math.random()<.35
                ){

                    setTimeout(
                        ()=>createBalloon(),
                        random(70,220)
                    );
                }

            },
            spawnDelay
        );
}

/* TIMER */

function startTimer(){

    clearInterval(timerInterval);

    timeLeft=60;

    timerElement.textContent=timeLeft;

    timerInterval=
        setInterval(
            ()=>{

                if(!gameRunning)return;

                timeLeft--;

                timerElement.textContent=
                    timeLeft;

                if(timeLeft<=0){
                    endGame();
                }

            },
            1000
        );
}

/* START */

function startGame(){

    initAudio();

    clearBalloons();

    score=0;
    combo=0;
    lastPopTime=0;
    timeLeft=60;

    scoreElement.textContent="0";
    timerElement.textContent="60";

    gameRunning=true;

    startScreen.style.display="none";
    gameOver.style.display="none";

    startSpawner();
    startTimer();

    gameLoop.lastTime=
        performance.now();

    cancelAnimationFrame(
        animationFrame
    );

    animationFrame=
        requestAnimationFrame(
            gameLoop
        );
}

/* END */

function endGame(){

    gameRunning=false;

    clearInterval(timerInterval);
    clearInterval(spawnInterval);

    cancelAnimationFrame(animationFrame);

    clearBalloons();

    finalScoreElement.textContent=score;

    gameOver.style.display="flex";
}

/* CLEAR */

function clearBalloons(){

    for(const [,data] of activeBalloons){

        if(
            data.element &&
            data.element.parentNode
        ){
            data.element.remove();
        }
    }

    activeBalloons.clear();

    document
        .querySelectorAll(
            ".pop-particle,.pop-ring,.score-popup"
        )
        .forEach(
            el=>el.remove()
        );
}

/* SPEED SELECTOR */

const speedButtons=
    document.querySelectorAll(
        ".speed-option"
    );

speedButtons.forEach(button=>{

    button.addEventListener(
        "pointerdown",
        event=>{

            event.preventDefault();
            event.stopPropagation();

            gameSpeed=
                button.dataset.speed;

            speedButtons.forEach(
                btn=>
                    btn.classList.remove(
                        "active"
                    )
            );

            button.classList.add("active");
        },
        {passive:false}
    );
});

/* BUTTONS */

startButton.addEventListener(
    "pointerdown",
    event=>{
        event.preventDefault();
        startGame();
    },
    {passive:false}
);

restartButton.addEventListener(
    "pointerdown",
    event=>{
        event.preventDefault();
        startGame();
    },
    {passive:false}
);

/* PREVENT CONTEXT MENU */

document.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);

/* PREVENT SCROLL */

document.addEventListener(
    "touchmove",
    e=>{

        if(gameRunning){
            e.preventDefault();
        }

    },
    {passive:false}
);

/* RESIZE */

window.addEventListener(
    "resize",
    ()=>{

        for(const [,data] of activeBalloons){

            const width=
                data.element.offsetWidth;

            const maxX=
                Math.max(
                    0,
                    window.innerWidth-width
                );

            data.x=
                Math.min(
                    Math.max(0,data.x),
                    maxX
                );

            data.element.style.left=
                data.x+"px";
        }
    }
);

</script>
