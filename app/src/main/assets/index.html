<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#f5c98b">

<title>बिल्ली मत मारो</title>

<style>
/* =========================================================
   BILLI MAT MARO
   Single-file offline toddler touch game
   No libraries / no external images / no CDN
   ========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:none;
  background:#f4d39e;
  font-family:
    "Noto Sans Devanagari",
    "Mangal",
    "Arial",
    sans-serif;
}

body{
  position:fixed;
  inset:0;
}

button{
  font:inherit;
  border:0;
  outline:0;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#f4d39e;
}


/* =========================================================
   ROOM
   ========================================================= */

.room{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #dff5ff 0%,
      #dff5ff 56%,
      #d5a46a 56%,
      #b97842 100%
    );
}


/* wallpaper */

.wall{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:57%;

  background:
    radial-gradient(
      circle at 15px 15px,
      rgba(255,255,255,.24) 0 2px,
      transparent 3px
    ) 0 0/42px 42px,

    linear-gradient(
      180deg,
      #dff5ff,
      #c9e9f4
    );
}


/* subtle wallpaper lines */

.wall::after{
  content:"";
  position:absolute;
  inset:0;

  opacity:.13;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 65px,
      rgba(100,150,170,.45) 66px 68px
    );
}


/* floor */

.floor{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:44%;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(90,43,20,.10) 0 2px,
      transparent 2px 54px
    ),

    repeating-linear-gradient(
      90deg,
      transparent 0 110px,
      rgba(85,40,18,.11) 111px 114px
    ),

    linear-gradient(
      180deg,
      #c78a51,
      #a96336
    );
}


/* floor highlights */

.floor::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,215,165,.10) 0 3px,
      transparent 3px 52px
    );
}


/* baseboard */

.baseboard{
  position:absolute;
  left:0;
  right:0;
  top:54.5%;
  height:4%;

  background:
    linear-gradient(
      180deg,
      #fff0c8,
      #d59a5e
    );

  border-top:3px solid rgba(255,255,255,.75);
  border-bottom:4px solid rgba(90,45,22,.25);

  box-shadow:
    0 5px 12px rgba(50,25,10,.18);
}


/* =========================================================
   WINDOW
   ========================================================= */

.window{
  position:absolute;

  width:min(31vw,310px);
  height:min(27vh,260px);

  min-width:190px;
  min-height:150px;

  left:7%;
  top:8%;

  border:12px solid #8a4e2d;
  border-radius:20px;

  background:#72cef2;

  box-shadow:
    0 12px 25px rgba(55,30,15,.25),
    inset 0 0 0 5px #f5c986;

  overflow:hidden;
}

.sky{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at 78% 20%,
      #fff7a2 0 9%,
      #ffd95c 10% 13%,
      transparent 14%
    ),

    linear-gradient(
      #68c8f1,
      #b8ebfa
    );
}


/* sun glow */

.sky::before{
  content:"";
  position:absolute;

  width:130px;
  height:130px;

  right:-35px;
  top:-45px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,246,150,.8),
      rgba(255,220,70,.25) 45%,
      transparent 70%
    );
}


/* clouds */

.cloud{
  position:absolute;

  width:100px;
  height:30px;

  background:white;
  border-radius:50px;

  opacity:.72;

  filter:blur(.3px);

  animation:
    cloudMove 16s linear infinite;
}

.cloud::before,
.cloud::after{
  content:"";
  position:absolute;

  background:white;
  border-radius:50%;
}

.cloud::before{
  width:42px;
  height:42px;
  left:16px;
  bottom:7px;
}

.cloud::after{
  width:54px;
  height:54px;
  right:14px;
  bottom:4px;
}

.cloud.one{
  left:-120px;
  top:35px;
}

.cloud.two{
  left:-180px;
  top:95px;
  transform:scale(.72);
  animation-delay:-7s;
}

@keyframes cloudMove{
  from{
    transform:translateX(0);
  }
  to{
    transform:translateX(480px);
  }
}

.cloud.two{
  animation-name:cloudMove2;
}

@keyframes cloudMove2{
  from{
    transform:translateX(0) scale(.72);
  }
  to{
    transform:translateX(500px) scale(.72);
  }
}


/* window bars */

.window::before{
  content:"";

  position:absolute;
  z-index:5;

  left:50%;
  top:0;
  bottom:0;

  width:7px;

  transform:translateX(-50%);

  background:#8a4e2d;
}

.window::after{
  content:"";

  position:absolute;
  z-index:5;

  left:0;
  right:0;
  top:50%;

  height:7px;

  transform:translateY(-50%);

  background:#8a4e2d;
}


/* =========================================================
   CURTAINS
   ========================================================= */

.curtain{
  position:absolute;
  z-index:7;

  top:5%;
  width:9%;
  height:32%;

  background:
    repeating-linear-gradient(
      90deg,
      #c93342 0 15px,
      #ef6570 15px 30px
    );

  box-shadow:
    0 9px 18px rgba(70,20,20,.22);
}

.curtain.left{
  left:2%;
  border-radius:0 0 50% 25%;
  transform:rotate(2deg);
}

.curtain.right{
  right:2%;
  border-radius:0 0 25% 50%;
  transform:rotate(-2deg);
}


/* curtain tiebacks */

.tie{
  position:absolute;
  z-index:8;

  top:27%;

  width:36px;
  height:36px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      #ffe88a,
      #e7a72d 55%,
      #a96c17
    );

  box-shadow:0 4px 8px rgba(70,30,10,.2);
}

.tie.left{
  left:7%;
}

.tie.right{
  right:7%;
}


/* =========================================================
   WALL FRAMES
   ========================================================= */

.frame{
  position:absolute;
  z-index:4;

  width:120px;
  height:95px;

  padding:8px;

  background:#f8e1a9;

  border:7px solid #8a4f2b;

  border-radius:8px;

  box-shadow:
    0 8px 16px rgba(55,25,10,.2);
}

.frame.one{
  right:10%;
  top:8%;
  transform:rotate(3deg);
}

.frame.two{
  right:4%;
  top:25%;
  transform:rotate(-4deg);
}

.picture{
  width:100%;
  height:100%;

  border-radius:3px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:42px;

  background:
    linear-gradient(
      135deg,
      #a8e7ff,
      #fff2b5
    );
}


/* =========================================================
   SHELF
   ========================================================= */

.shelf{
  position:absolute;
  z-index:4;

  right:15%;
  top:38%;

  width:240px;
  height:16px;

  border-radius:5px;

  background:
    linear-gradient(
      #b96c37,
      #75401f
    );

  box-shadow:
    0 8px 12px rgba(60,25,10,.22);
}

.toy{
  position:absolute;
  bottom:13px;

  font-size:42px;

  filter:
    drop-shadow(0 5px 3px rgba(50,20,10,.18));
}

.toy.a{
  left:15px;
}

.toy.b{
  left:85px;
}

.toy.c{
  right:18px;
}


/* =========================================================
   PLANT
   ========================================================= */

.plant{
  position:absolute;
  z-index:4;

  right:2%;
  bottom:39%;

  width:110px;
  height:150px;
}

.pot{
  position:absolute;

  bottom:0;
  left:20px;

  width:70px;
  height:62px;

  background:
    linear-gradient(
      90deg,
      #b65c32,
      #e38a4b,
      #a74a29
    );

  clip-path:
    polygon(
      8% 0,
      92% 0,
      78% 100%,
      22% 100%
    );

  border-radius:0 0 15px 15px;
}

.leaf{
  position:absolute;

  width:42px;
  height:76px;

  background:
    linear-gradient(
      135deg,
      #6fc45c,
      #27743c
    );

  border-radius:
    100% 0 100% 0;

  transform-origin:bottom center;
}

.leaf.l1{
  left:30px;
  bottom:48px;
  transform:rotate(-34deg);
}

.leaf.l2{
  left:48px;
  bottom:58px;
  transform:rotate(28deg);
}

.leaf.l3{
  left:8px;
  bottom:45px;
  transform:rotate(-65deg) scale(.8);
}

.leaf.l4{
  right:2px;
  bottom:42px;
  transform:rotate(67deg) scale(.8);
}


/* =========================================================
   TOY BOX
   ========================================================= */

.toybox{
  position:absolute;
  z-index:4;

  left:3%;
  bottom:15%;

  width:150px;
  height:100px;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      #efb04f,
      #d66c32
    );

  border:6px solid #a6532c;

  box-shadow:
    0 10px 15px rgba(60,25,10,.2);
}

.toybox::before{
  content:"खिलौने";

  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  font-weight:900;
  font-size:20px;

  color:#fff6d5;
}

.toybox::after{
  content:"";

  position:absolute;

  left:-8px;
  right:-8px;
  top:-18px;

  height:23px;

  border-radius:12px;

  background:#f5c264;

  border:5px solid #a6532c;
}


/* =========================================================
   RUG
   ========================================================= */

.rug{
  position:absolute;
  z-index:3;

  left:50%;
  bottom:4%;

  width:min(70vw,650px);
  height:min(24vw,210px);

  min-width:330px;
  min-height:130px;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      #ffd98e 0 55%,
      #efae62 56% 72%,
      #d77a45 73% 100%
    );

  border:8px solid rgba(140,70,30,.35);

  box-shadow:
    0 15px 18px rgba(60,25,10,.25),
    inset 0 5px 12px rgba(255,255,255,.3);
}


/* =========================================================
   FLOATING BACKGROUND OBJECTS
   ========================================================= */

.float{
  position:absolute;
  z-index:2;

  opacity:.55;

  animation:
    floatUp 8s ease-in-out infinite;
}

.float.star{
  font-size:34px;
}

.float.balloon{
  font-size:42px;
}

.float.f1{
  left:35%;
  bottom:-50px;
  animation-delay:-1s;
}

.float.f2{
  left:62%;
  bottom:-60px;
  animation-delay:-4s;
}

.float.f3{
  left:78%;
  bottom:-50px;
  animation-delay:-6s;
}

@keyframes floatUp{

  0%{
    transform:translateY(0) rotate(0);
    opacity:0;
  }

  15%{
    opacity:.55;
  }

  80%{
    opacity:.35;
  }

  100%{
    transform:translateY(-85vh) rotate(180deg);
    opacity:0;
  }
}


/* =========================================================
   UI
   ========================================================= */

#counter{
  position:absolute;
  z-index:100;

  top:
    calc(
      env(safe-area-inset-top) + 16px
    );

  right:
    calc(
      env(safe-area-inset-right) + 16px
    );

  min-width:130px;

  padding:12px 20px;

  text-align:center;

  color:#63361f;

  font-size:clamp(18px,4vw,28px);
  font-weight:1000;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.97),
      rgba(255,231,183,.86)
    );

  border:
    2px solid rgba(255,255,255,.95);

  border-radius:30px;

  box-shadow:
    0 9px 25px rgba(67,35,20,.2),
    inset 0 2px 5px rgba(255,255,255,.95),
    inset 0 -3px 8px rgba(190,120,55,.12);

  backdrop-filter:blur(12px);

  transition:
    transform .15s ease;
}

#counter.bump{
  animation:counterBump .25s ease;
}

@keyframes counterBump{
  50%{
    transform:scale(1.16) rotate(-2deg);
  }
}


/* parent sound indicator */

#soundState{
  position:absolute;
  z-index:101;

  top:
    calc(
      env(safe-area-inset-top) + 75px
    );

  right:
    calc(
      env(safe-area-inset-right) + 22px
    );

  font-size:14px;
  font-weight:900;

  padding:5px 11px;

  border-radius:20px;

  background:rgba(255,255,255,.55);

  color:#71442b;

  opacity:0;

  transition:opacity .25s;
}


/* hint */

#hint{
  position:absolute;
  z-index:100;

  left:50%;

  bottom:
    calc(
      env(safe-area-inset-bottom) + 14px
    );

  transform:translateX(-50%);

  width:max-content;
  max-width:92vw;

  padding:12px 22px;

  text-align:center;

  color:#663820;

  font-size:clamp(14px,3.4vw,21px);
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.94),
      rgba(255,238,201,.88)
    );

  border:
    2px solid rgba(255,255,255,.95);

  border-radius:30px;

  box-shadow:
    0 9px 25px rgba(70,35,15,.18),
    inset 0 2px 4px rgba(255,255,255,.95);

  backdrop-filter:blur(10px);
}


/* =========================================================
   CAT STAGE
   ========================================================= */

#catStage{
  position:absolute;
  z-index:20;

  left:50%;
  top:53%;

  width:min(62vw,610px);
  height:min(72vh,650px);

  min-width:320px;
  min-height:420px;

  transform:
    translate(-50%,-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}

#cat{
  width:100%;
  height:100%;

  overflow:visible;

  transform-origin:50% 82%;

  filter:
    drop-shadow(
      0 13px 8px
      rgba(55,25,15,.24)
    );

  transition:
    filter .2s ease;
}


/* =========================================================
   CAT EXPRESSIONS
   ========================================================= */

.normalOnly,
.hurtOnly,
.laughOnly{
  opacity:0;

  transition:
    opacity .12s ease;
}

#cat.normal .normalOnly{
  opacity:1;
}

#cat.hurt .hurtOnly{
  opacity:1;
}

#cat.laugh .laughOnly{
  opacity:1;
}


/* normal */

#cat.normal .catBody{
  animation:
    realisticBreathing 3s ease-in-out infinite;
  transform-origin:50% 70%;
}

#cat.normal .headGroup{
  animation:
    naturalHeadMotion 8s ease-in-out infinite;
  transform-origin:50% 50%;
}

#cat.normal .tail{
  animation:
    realisticTail 3s ease-in-out infinite;
  transform-origin:78% 72%;
}


/* hurt */

#cat.hurt .catBody{
  animation:
    realisticFlinch .42s cubic-bezier(.25,.8,.3,1) 2;
  transform-origin:50% 70%;
}

#cat.hurt .headGroup{
  animation:
    hurtHeadShake .42s cubic-bezier(.25,.8,.3,1) 2;
  transform-origin:50% 55%;
}

#cat.hurt .tail{
  animation:
    hurtTailDrop .55s ease-out forwards;
  transform-origin:78% 72%;
}


/* laugh */

#cat.laugh .catBody{
  animation:
    realisticLaughBody .48s ease-in-out infinite;
  transform-origin:50% 72%;
}

#cat.laugh .headGroup{
  animation:
    realisticLaughHead .62s ease-in-out infinite;
  transform-origin:50% 50%;
}

#cat.laugh .tail{
  animation:
    realisticLaughTail .43s ease-in-out infinite;
  transform-origin:78% 72%;
}


@keyframes realisticBreathing{
  0%,100%{
    transform:
      translateY(0)
      scale(1,1);
  }

  50%{
    transform:
      translateY(-2px)
      scale(1.008,1.018);
  }
}


@keyframes naturalHeadMotion{
  0%,76%,100%{
    transform:rotate(0);
  }

  81%{
    transform:rotate(-1.7deg);
  }

  86%{
    transform:rotate(1.5deg);
  }

  91%{
    transform:rotate(-.7deg);
  }
}


@keyframes realisticTail{
  0%,100%{
    transform:rotate(-4deg);
  }

  25%{
    transform:rotate(5deg);
  }

  55%{
    transform:rotate(10deg);
  }

  80%{
    transform:rotate(-1deg);
  }
}


@keyframes realisticFlinch{
  0%{
    transform:translateX(0) scale(1);
  }

  18%{
    transform:translateX(-10px) scale(.985);
  }

  35%{
    transform:translateX(11px) scale(1.005);
  }

  52%{
    transform:translateX(-8px);
  }

  70%{
    transform:translateX(6px);
  }

  100%{
    transform:translateX(0) scale(1);
  }
}


@keyframes hurtHeadShake{
  0%,100%{
    transform:rotate(0);
  }

  25%{
    transform:rotate(-3deg);
  }

  50%{
    transform:rotate(3deg);
  }

  75%{
    transform:rotate(-2deg);
  }
}


@keyframes hurtTailDrop{
  0%{
    transform:rotate(0);
  }

  100%{
    transform:rotate(29deg);
  }
}


@keyframes realisticLaughBody{
  0%,100%{
    transform:
      translateY(0)
      scale(1);
  }

  50%{
    transform:
      translateY(-8px)
      scale(1.018,1.025);
  }
}


@keyframes realisticLaughHead{
  0%,100%{
    transform:rotate(-2deg) translateY(0);
  }

  25%{
    transform:rotate(3deg) translateY(-2px);
  }

  50%{
    transform:rotate(-3deg) translateY(-4px);
  }

  75%{
    transform:rotate(2deg) translateY(-2px);
  }
}


@keyframes realisticLaughTail{
  0%,100%{
    transform:rotate(-16deg);
  }

  50%{
    transform:rotate(20deg);
  }
}


/* blink */

#cat.blink .normalEyes{
  transform:
    scaleY(.08)
    translateY(4px);

  transform-origin:50% 50%;

  transition:
    transform .055s ease;
}


/* =========================================================
   TEARS
   ========================================================= */

.tear{
  fill:#62c8f5;

  filter:
    drop-shadow(
      0 2px 2px
      rgba(40,130,180,.3)
    );

  animation:
    tearDrop .8s ease-in infinite;
}

@keyframes tearDrop{
  0%{
    transform:translateY(-2px);
    opacity:.5;
  }

  50%{
    opacity:1;
  }

  100%{
    transform:translateY(13px);
    opacity:.1;
  }
}


/* =========================================================
   MESSAGE
   ========================================================= */

#message{
  position:absolute;
  z-index:90;

  left:50%;
  top:22%;

  max-width:82vw;

  padding:13px 25px;

  color:#61331f;

  font-size:clamp(22px,5vw,36px);
  font-weight:1000;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #fff0e8
    );

  border:
    3px solid rgba(255,255,255,.95);

  border-radius:28px;

  box-shadow:
    0 12px 30px rgba(75,30,30,.22),
    inset 0 2px 5px rgba(255,255,255,.9);

  opacity:0;

  transform:
    translate(-50%,10px)
    scale(.75);

  pointer-events:none;
}

#message.show{
  animation:
    messagePop 1.35s ease forwards;
}

@keyframes messagePop{
  0%{
    opacity:0;
    transform:
      translate(-50%,15px)
      scale(.7);
  }

  15%{
    opacity:1;
    transform:
      translate(-50%,0)
      scale(1.08);
  }

  25%{
    transform:
      translate(-50%,0)
      scale(1);
  }

  75%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-20px)
      scale(.94);
  }
}


/* =========================================================
   SLAP HAND
   ========================================================= */

.slapHand{
  position:absolute;
  z-index:200;

  pointer-events:none;

  font-size:
    clamp(65px,15vw,125px);

  transform:
    translate(-50%,-50%)
    scale(.2)
    rotate(-30deg);

  opacity:0;

  filter:
    drop-shadow(
      0 7px 4px
      rgba(0,0,0,.22)
    );
}

.slapHand.show{
  animation:
    slapHandAnim .48s cubic-bezier(.2,.8,.2,1);
}

@keyframes slapHandAnim{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.2)
      rotate(-35deg);
  }

  22%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.25)
      rotate(-8deg);
  }

  45%{
    transform:
      translate(-50%,-50%)
      scale(1.05)
      rotate(7deg);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1.4)
      rotate(16deg);
  }
}


/* =========================================================
   PARTICLES
   ========================================================= */

.particle{
  position:absolute;
  z-index:190;

  pointer-events:none;

  font-size:
    clamp(24px,6vw,52px);

  transform:
    translate(-50%,-50%)
    scale(.3);

  opacity:0;

  filter:
    drop-shadow(
      0 3px 4px
      rgba(0,0,0,.18)
    );
}

.particle.fly{
  animation:
    particleFly .75s ease-out forwards;
}

@keyframes particleFly{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.25)
      rotate(0);
  }

  15%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translate(
        calc(-50% + var(--dx)),
        calc(-50% + var(--dy))
      )
      scale(1)
      rotate(var(--rot));
  }
}


/* =========================================================
   CELEBRATION
   ========================================================= */

.confetti{
  position:absolute;
  z-index:180;

  pointer-events:none;

  font-size:28px;

  animation:
    confettiFall 1.1s ease-out forwards;
}

@keyframes confettiFall{
  0%{
    opacity:1;
    transform:
      translateY(0)
      rotate(0)
      scale(.5);
  }

  100%{
    opacity:0;
    transform:
      translateY(
        calc(100px + var(--fall))
      )
      rotate(360deg)
      scale(1.2);
  }
}


/* =========================================================
   START SCREEN
   ========================================================= */

<script>
/* =========================================================
   BILLI MAT MARO
   GAME JAVASCRIPT
   ========================================================= */


/* =========================================================
   CONFIG
   ========================================================= */

const USE_CUSTOM_AUDIO = false;


/*
  If USE_CUSTOM_AUDIO = true:
  The browser tries:

  matmaro.mp3
  meow.mp3

  If unavailable, synthesized sounds are used automatically.
*/


/* =========================================================
   DOM
   ========================================================= */

const game =
  document.getElementById("game");

const cat =
  document.getElementById("cat");

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const counter =
  document.getElementById("counter");

const touchCount =
  document.getElementById("touchCount");

const message =
  document.getElementById("message");

const soundState =
  document.getElementById("soundState");


/* =========================================================
   GAME STATE
   ========================================================= */

let audioCtx = null;

let masterGain = null;

let audioStarted = false;

let soundEnabled = true;

let totalHits = 0;

let sequenceHit = 0;

let currentExpression = "normal";

let laughTimer = null;

let messageTimer = null;

let blinkTimer = null;


/* =========================================================
   POINTER STATE
   ========================================================= */

let pointerActive = false;

let pointerId = null;

let startX = 0;
let startY = 0;

let lastX = 0;
let lastY = 0;

let moved = false;

let rubbing = false;

let rubStartTime = 0;

let rubTimer = null;

let tapTimer = null;

let pointerStartTime = 0;

const MOVE_CANCEL_DISTANCE = 18;

const RUB_TIME = 2000;

const TAP_DELAY = 180;


/* =========================================================
   AUDIO FILE FALLBACK
   ========================================================= */

let customSlap = null;
let customMeow = null;

if(USE_CUSTOM_AUDIO){

  customSlap =
    new Audio("matmaro.mp3");

  customMeow =
    new Audio("meow.mp3");

  customSlap.preload = "auto";
  customMeow.preload = "auto";
}


/* =========================================================
   AUDIO INITIALIZATION
   IMPORTANT:
   Called from user gesture
   ========================================================= */

function initAudio(){

  if(audioStarted){

    if(
      audioCtx &&
      audioCtx.state === "suspended"
    ){
      audioCtx.resume();
    }

    return;
  }


  try{

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();


    masterGain =
      audioCtx.createGain();

    /*
      Toddler-friendly volume.
    */

    masterGain.gain.value =
      .42;


    masterGain.connect(
      audioCtx.destination
    );


    if(
      audioCtx.state === "suspended"
    ){
      audioCtx.resume();
    }


    audioStarted = true;


  }catch(error){

    console.warn(
      "Audio unavailable",
      error
    );

  }
}


/* =========================================================
   CUSTOM AUDIO PLAYBACK
   ========================================================= */

function playCustom(audio){

  if(!audio || !soundEnabled){
    return false;
  }

  try{

    audio.currentTime = 0;

    const p =
      audio.play();

    if(p){
      p.catch(()=>{
        /* fallback handled by caller */
      });
    }

    return true;

  }catch(e){

    return false;

  }
}


/* =========================================================
   MASTER VOLUME
   ========================================================= */

function setSoundEnabled(enabled){

  soundEnabled = enabled;

  if(masterGain){

    masterGain.gain.setTargetAtTime(
      enabled ? .42 : 0,
      audioCtx.currentTime,
      .025
    );

  }

  soundState.textContent =
    enabled
      ? "🔊 आवाज़ चालू"
      : "🔇 आवाज़ बंद";

  soundState.style.opacity = "1";

  clearTimeout(
    setSoundEnabled.timer
  );

  setSoundEnabled.timer =
    setTimeout(()=>{

      soundState.style.opacity = "0";

    },1800);
}


/* =========================================================
   REALISTIC THAP / SLAP
   ========================================================= */

function synthSlap(){

  if(
    !audioCtx ||
    !masterGain ||
    !soundEnabled
  ){
    return;
  }


  const now =
    audioCtx.currentTime;


  /* =====================================================
     1. SHARP IMPACT
     ===================================================== */

  const impactOsc =
    audioCtx.createOscillator();

  const impactGain =
    audioCtx.createGain();

  impactOsc.type =
    "triangle";


  impactOsc.frequency.setValueAtTime(
    155,
    now
  );

  impactOsc.frequency.exponentialRampToValueAtTime(
    72,
    now + .095
  );


  impactGain.gain.setValueAtTime(
    .0001,
    now
  );

  impactGain.gain.exponentialRampToValueAtTime(
    .72,
    now + .004
  );

  impactGain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .12
  );


  impactOsc
    .connect(impactGain)
    .connect(masterGain);


  impactOsc.start(now);

  impactOsc.stop(
    now + .13
  );


  /* =====================================================
     2. HAND NOISE
     ===================================================== */

  const duration =
    .16;


  const buffer =
    audioCtx.createBuffer(
      1,
      Math.floor(
        audioCtx.sampleRate *
        duration
      ),
      audioCtx.sampleRate
    );


  const data =
    buffer.getChannelData(0);


  for(
    let i = 0;
    i < data.length;
    i++
  ){

    const t =
      i / data.length;

    const envelope =
      Math.pow(
        1 - t,
        4.8
      );

    data[i] =
      (Math.random()*2-1)
      *
      envelope
      *
      .95;
  }


  const source =
    audioCtx.createBufferSource();

  source.buffer =
    buffer;


  const bandpass =
    audioCtx.createBiquadFilter();

  bandpass.type =
    "bandpass";

  bandpass.frequency.setValueAtTime(
    1150,
    now
  );

  bandpass.frequency.exponentialRampToValueAtTime(
    430,
    now + .13
  );

  bandpass.Q.value =
    .65;


  const noiseGain =
    audioCtx.createGain();


  noiseGain.gain.setValueAtTime(
    .0001,
    now
  );

  noiseGain.gain.exponentialRampToValueAtTime(
    .8,
    now + .003
  );

  noiseGain.gain.exponentialRampToValueAtTime(
    .0001,
    now + duration
  );


  source
    .connect(bandpass)
    .connect(noiseGain)
    .connect(masterGain);


  source.start(now);

  source.stop(
    now + duration
  );


  /* =====================================================
     3. LOW THUMP
     ===================================================== */

  const thump =
    audioCtx.createOscillator();

  const thumpGain =
    audioCtx.createGain();


  thump.type =
    "sine";


  thump.frequency.setValueAtTime(
    105,
    now
  );

  thump.frequency.exponentialRampToValueAtTime(
    48,
    now + .11
  );


  thumpGain.gain.setValueAtTime(
    .0001,
    now
  );

  thumpGain.gain.exponentialRampToValueAtTime(
    .42,
    now + .005
  );

  thumpGain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .13
  );


  thump
    .connect(thumpGain)
    .connect(masterGain);


  thump.start(now);

  thump.stop(
    now + .14
  );


  /* =====================================================
     4. VERY SHORT ROOM REFLECTION
     ===================================================== */

  const echoGain =
    audioCtx.createGain();


  echoGain.gain.setValueAtTime(
    .0001,
    now + .075
  );

  echoGain.gain.exponentialRampToValueAtTime(
    .09,
    now + .082
  );

  echoGain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .19
  );


  const echoOsc =
    audioCtx.createOscillator();


  echoOsc.type =
    "triangle";


  echoOsc.frequency.setValueAtTime(
    180,
    now + .075
  );

  echoOsc.frequency.exponentialRampToValueAtTime(
    90,
    now + .17
  );


  echoOsc
    .connect(echoGain)
    .connect(masterGain);


  echoOsc.start(
    now + .075
  );

  echoOsc.stop(
    now + .19
  );
}


/* =========================================================
   MEOW SOUND
   ========================================================= */

function synthMeow(){

  if(
    !audioCtx ||
    !masterGain ||
    !soundEnabled
  ){
    return;
  }


  const now =
    audioCtx.currentTime;


  /* voice 1 */

  const osc1 =
    audioCtx.createOscillator();

  const gain1 =
    audioCtx.createGain();


  osc1.type =
    "sine";


  osc1.frequency.setValueAtTime(
    420,
    now
  );

  osc1.frequency.exponentialRampToValueAtTime(
    760,
    now + .12
  );

  osc1.frequency.exponentialRampToValueAtTime(
    520,
    now + .48
  );


  gain1.gain.setValueAtTime(
    .0001,
    now
  );

  gain1.gain.exponentialRampToValueAtTime(
    .34,
    now + .025
  );

  gain1.gain.exponentialRampToValueAtTime(
    .0001,
    now + .52
  );


  osc1
    .connect(gain1)
    .connect(masterGain);


  osc1.start(now);

  osc1.stop(
    now + .55
  );


  /* voice 2 */

  const osc2 =
    audioCtx.createOscillator();

  const gain2 =
    audioCtx.createGain();


  osc2.type =
    "triangle";


  osc2.frequency.setValueAtTime(
    610,
    now
  );

  osc2.frequency.exponentialRampToValueAtTime(
    890,
    now + .13
  );

  osc2.frequency.exponentialRampToValueAtTime(
    570,
    now + .46
  );


  gain2.gain.setValueAtTime(
    .0001,
    now
  );

  gain2.gain.exponentialRampToValueAtTime(
    .13,
    now + .025
  );

  gain2.gain.exponentialRampToValueAtTime(
    .0001,
    now + .50
  );


  osc2
    .connect(gain2)
    .connect(masterGain);


  osc2.start(now);

  osc2.stop(
    now + .52
  );
}


/* =========================================================
   PLAY MEOW
   ========================================================= */

function playMeow(){

  if(!soundEnabled){
    return;
  }

  if(
    USE_CUSTOM_AUDIO &&
    customMeow
  ){

    try{

      customMeow.currentTime = 0;

      const p =
        customMeow.play();

      if(p){

        p.catch(()=>{
          synthMeow();
        });

      }

      return;

    }catch(e){}

  }


  synthMeow();
}


/* =========================================================
   HINDI SPEECH
   ========================================================= */

let hindiVoice = null;


/* voice selection */

function findHindiVoice(){

  if(
    !("speechSynthesis" in window)
  ){
    return;
  }


  const voices =
    speechSynthesis.getVoices();


  /*
    Prefer Hindi India.
  */

  hindiVoice =
    voices.find(
      v =>
        v.lang &&
        v.lang.toLowerCase() ===
        "hi-in"
    )


    ||

    voices.find(
      v =>
        v.lang &&
        v.lang.toLowerCase()
        .startsWith("hi")
    )


    ||

    null;
}


if("speechSynthesis" in window){

  findHindiVoice();

  speechSynthesis.onvoiceschanged =
    findHindiVoice;
}


/* =========================================================
   WARMUP TTS
   ========================================================= */

function warmupHindi(){

  if(
    !("speechSynthesis" in window)
  ){
    return;
  }


  findHindiVoice();


  try{

    const u =
      new SpeechSynthesisUtterance(
        "म्याऊँ"
      );

    u.lang =
      "hi-IN";

    if(hindiVoice){
      u.voice =
        hindiVoice;
    }

    u.volume =
      0.01;

    u.rate =
      1.25;

    u.pitch =
      1.55;


    speechSynthesis.cancel();

    speechSynthesis.speak(u);

  }catch(e){}

}


/* =========================================================
   SPEAK DON'T HIT
   ========================================================= */

function speakDontHit(){

  if(
    !soundEnabled ||
    !("speechSynthesis" in window)
  ){
    return;
  }


  findHindiVoice();


  try{

    speechSynthesis.cancel();


    const u =
      new SpeechSynthesisUtterance(
        "मुझे मत मारो"
      );


    u.lang =
      "hi-IN";


    if(hindiVoice){
      u.voice =
        hindiVoice;
    }


    /*
      Cute child-like delivery.
    */

    u.rate =
      .82;

    u.pitch =
      1.55;

    u.volume =
      .8;


    speechSynthesis.speak(u);

  }catch(e){}

}


/* =========================================================
   VIBRATION
   ========================================================= */

function vibrate(ms){

  if(
    "vibrate" in navigator
  ){

    try{

      navigator.vibrate(ms);

    }catch(e){}

  }

}


/* =========================================================
   EXPRESSION
   ========================================================= */

function setExpression(
  expression,
  duration = 900
){

  clearTimeout(
    setExpression.timer
  );


  currentExpression =
    expression;


  cat.classList.remove(
    "normal",
    "hurt",
    "laugh"
  );


  cat.classList.add(
    expression
  );


  if(
    expression === "hurt"
  ){

    setExpression.timer =
      setTimeout(()=>{

        if(!rubbing){

          cat.classList.remove(
            "hurt"
          );

          cat.classList.add(
            "normal"
          );

          currentExpression =
            "normal";

        }

      },duration);

  }

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

  clearTimeout(
    messageTimer
  );


  message.textContent =
    text;


  message.classList.remove(
    "show"
  );


  /*
    Force reflow so animation can
    replay every hit.
  */

  void message.offsetWidth;


  message.classList.add(
    "show"
  );


  messageTimer =
    setTimeout(()=>{

      message.classList.remove(
        "show"
      );

    },1400);

}


/* =========================================================
   SLAP EFFECT
   ========================================================= */

function createSlapEffect(
  x,
  y
){

  const hand =
    document.createElement("div");


  hand.className =
    "slapHand";


  hand.textContent =
    "🖐️";


  hand.style.left =
    x + "px";

  hand.style.top =
    y + "px";


  game.appendChild(hand);


  requestAnimationFrame(()=>{

    hand.classList.add(
      "show"
    );

  });


  setTimeout(()=>{

    hand.remove();

  },550);


  /* particles */

  const emojis =
    ["💥","⭐","✨","💫"];


  for(
    let i=0;
    i<5;
    i++
  ){

    const particle =
      document.createElement("div");


    particle.className =
      "particle";


    particle.textContent =
      emojis[
        Math.floor(
          Math.random() *
          emojis.length
        )
      ];


    particle.style.left =
      x + "px";

    particle.style.top =
      y + "px";


    const angle =
      Math.random() *
      Math.PI * 2;


    const distance =
      55 +
      Math.random()*80;


    particle.style.setProperty(
      "--dx",
      (
        Math.cos(angle) *
        distance
      ) + "px"
    );


    particle.style.setProperty(
      "--dy",
      (
        Math.sin(angle) *
        distance
      ) + "px"
    );


    particle.style.setProperty(
      "--rot",
      (
        Math.random()*180-90
      ) + "deg"
    );


    game.appendChild(
      particle
    );


    requestAnimationFrame(()=>{

      particle.classList.add(
        "fly"
      );

    });


    setTimeout(()=>{

      particle.remove();

    },850);

  }

}


/* =========================================================
   CELEBRATION
   ========================================================= */

function celebration(){

  const emojis =
    [
      "⭐",
      "✨",
      "🎉",
      "🌟",
      "💛",
      "🎈"
    ];


  for(
    let i=0;
    i<14;
    i++
  ){

    const c =
      document.createElement("div");


    c.className =
      "confetti";


    c.textContent =
      emojis[
        Math.floor(
          Math.random() *
          emojis.length
        )
      ];


    c.style.left =
      (
        15 +
        Math.random()*70
      ) + "%";


    c.style.top =
      (
        20 +
        Math.random()*25
      ) + "%";


    c.style.setProperty(
      "--fall",
      (
        70 +
        Math.random()*180
      ) + "px"
    );


    game.appendChild(c);


    setTimeout(()=>{

      c.remove();

    },1200);

  }

}


/* =========================================================
   REGISTER HIT
   ========================================================= */

function registerHit(
  x,
  y
){

  /*
    If we are rubbing, NEVER hit.
  */

  if(rubbing){
    return;
  }


  totalHits++;

  sequenceHit++;


  /*
    1,2,3 = meow
    4 = Hindi phrase
    5,6,7 = meow
    8 = phrase
  */

  if(
    sequenceHit > 4
  ){
    sequenceHit = 1;
  }


  touchCount.textContent =
    totalHits;


  counter.classList.remove(
    "bump"
  );

  void counter.offsetWidth;

  counter.classList.add(
    "bump"
  );


  /* sound */

  if(soundEnabled){

    if(
      USE_CUSTOM_AUDIO &&
      customSlap
    ){

      try{

        customSlap.currentTime = 0;

        const p =
          customSlap.play();

        if(p){

          p.catch(()=>{
            synthSlap();
          });

        }

      }catch(e){

        synthSlap();

      }

    }else{

      synthSlap();

    }

  }


  /* vibration */

  vibrate(28);


  /* visual */

  createSlapEffect(
    x,
    y
  );


  /* hurt */

  setExpression(
    "hurt",
    850
  );


  /*
    Delay voice slightly after
    impact so the action feels natural.
  */

  setTimeout(()=>{

    if(
      sequenceHit === 4
    ){

      showMessage(
        "मुझे मत मारो 😭"
      );

      speakDontHit();

    }else{

      showMessage(
        "म्याऊँ! 😿"
      );

      playMeow();

    }

  },70);


  /* every tenth touch */

  if(
    totalHits % 10 === 0
  ){

    setTimeout(
      celebration,
      180
    );

  }

}


/* =========================================================
   RUB START
   ========================================================= */

function startRubbing(){

  if(rubbing){
    return;
  }


  rubbing =
    true;


  clearTimeout(
    laughTimer
  );


  /*
    IMPORTANT:
    Laughing is VISUAL ONLY.
    No sound.
  */

  setExpression(
    "laugh"
  );


  laughTimer =
    setTimeout(()=>{

      /*
        Laugh remains active while
        rubbing continues.
      */

      if(rubbing){

        setExpression(
          "laugh"
        );

      }

    },100);

}


/* =========================================================
   RUB STOP
   ========================================================= */

function stopRubbing(){

  if(!rubbing){
    return;
  }


  rubbing =
    false;


  clearTimeout(
    laughTimer
  );


  /*
    Laugh continues for approximately
    1.4 seconds after finger lifts.
  */

  setExpression(
    "laugh"
  );


  laughTimer =
    setTimeout(()=>{

      if(!rubbing){

        setExpression(
          "normal"
        );

      }

    },1400);

}


/* =========================================================
   POINTER DOWN
   ========================================================= */

function pointerDown(e){

  /*
    Only primary pointer.
  */

  if(
    pointerActive ||
    !e.isPrimary
  ){
    return;
  }


  pointerActive =
    true;


  pointerId =
    e.pointerId;


  startX =
    e.clientX;

  startY =
    e.clientY;


  lastX =
    startX;

  lastY =
    startY;


  moved =
    false;


  rubbing =
    false;


  pointerStartTime =
    performance.now();


  rubStartTime =
    performance.now();


  /*
    Capture pointer so movement
    remains tracked even if finger
    leaves the original element.
  */

  try{

    game.setPointerCapture(
      pointerId
    );

  }catch(e){}


  clearTimeout(
    tapTimer
  );


  clearTimeout(
    rubTimer
  );


  /*
    Rub activates after 2 seconds
    of continuous movement.
  */

  rubTimer =
    setTimeout(()=>{

      if(
        pointerActive &&
        moved
      ){

        startRubbing();

      }

    },RUB_TIME);


  /*
    Tap activates after 180ms
    if the finger remains still.
  */

  tapTimer =
    setTimeout(()=>{

      if(
        pointerActive &&
        !moved
      ){

        /*
          Don't immediately hit here if
          user might start rubbing.
          We wait for quick lift or
          movement.
        */

      }

    },TAP_DELAY);

}


/* =========================================================
   POINTER MOVE
   ========================================================= */

function pointerMove(e){

  if(
    !pointerActive ||
    e.pointerId !== pointerId
  ){
    return;
  }


  const dx =
    e.clientX -
    startX;


  const dy =
    e.clientY -
    startY;


  const distance =
    Math.sqrt(
      dx*dx +
      dy*dy
    );


  lastX =
    e.clientX;

  lastY =
    e.clientY;


  /*
    Any movement beyond small threshold
    cancels tap.
  */

  if(
    distance >
    MOVE_CANCEL_DISTANCE
  ){

    moved =
      true;


    clearTimeout(
      tapTimer
    );


    /*
      Continuous movement + 2 sec
      => laugh.
    */

    if(
      !rubbing &&
      performance.now() -
      rubStartTime >=
      RUB_TIME
    ){

      startRubbing();

    }

  }


  /*
    If rubbing, maintain laugh.
  */

  if(rubbing){

    setExpression(
      "laugh"
    );

  }

}


/* =========================================================
   POINTER UP
   ========================================================= */

function pointerUp(e){

  if(
    !pointerActive ||
    e.pointerId !== pointerId
  ){
    return;
  }


  clearTimeout(
    tapTimer
  );

  clearTimeout(
    rubTimer
  );


  const elapsed =
    performance.now() -
    pointerStartTime;


  /*
    If rubbing, never register hit.
  */

  if(rubbing){

    stopRubbing();

  }else{

    /*
      Quick tap:
      finger didn't move far.
    */

    if(!moved){

      registerHit(
        e.clientX,
        e.clientY
      );

    }

    /*
      If it moved but was released before
      2 seconds, it is treated as a cancelled
      rub and does NOT hit.
    */

  }


  try{

    game.releasePointerCapture(
      pointerId
    );

  }catch(e){}


  pointerActive =
    false;

  pointerId =
    null;

  moved =
    false;

}


/* =========================================================
   POINTER CANCEL
   ========================================================= */

function pointerCancel(e){

  if(
    e.pointerId !== pointerId
  ){
    return;
  }


  clearTimeout(
    tapTimer
  );

  clearTimeout(
    rubTimer
  );


  if(rubbing){

    stopRubbing();

  }


  pointerActive =
    false;

  pointerId =
    null;

  moved =
    false;

}


/* =========================================================
   POINTER EVENTS
   ========================================================= */

game.addEventListener(
  "pointerdown",
  pointerDown,
  {passive:false}
);

game.addEventListener(
  "pointermove",
  pointerMove,
  {passive:false}
);

game.addEventListener(
  "pointerup",
  pointerUp,
  {passive:false}
);

game.addEventListener(
  "pointercancel",
  pointerCancel,
  {passive:false}
);


/* =========================================================
   PREVENT CONTEXT MENU
   ========================================================= */

document.addEventListener(
  "contextmenu",
  e => e.preventDefault()
);


/* =========================================================
   PREVENT DOUBLE TAP / GESTURES
   ========================================================= */

document.addEventListener(
  "gesturestart",
  e => e.preventDefault()
);

document.addEventListener(
  "gesturechange",
  e => e.preventDefault()
);

document.addEventListener(
  "gestureend",
  e => e.preventDefault()
);


/* =========================================================
   RANDOM BLINKING
   ========================================================= */

function scheduleBlink(){

  clearTimeout(
    blinkTimer
  );


  const delay =
    1800 +
    Math.random()*4500;


  blinkTimer =
    setTimeout(()=>{

      if(
        currentExpression ===
        "normal" &&
        !rubbing
      ){

        cat.classList.add(
          "blink"
        );


        setTimeout(()=>{

          cat.classList.remove(
            "blink"
          );

        },95);

      }


      scheduleBlink();

    },delay);

}


/* =========================================================
   START GAME
   ========================================================= */

startButton.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();
    e.stopPropagation();


    /*
      AudioContext MUST start
      inside user gesture.
    */

    initAudio();


    /*
      Warm Hindi speech engine.
    */

    warmupHindi();


    /*
      Start game.
    */

    startScreen.classList.add(
      "hide"
    );


    setTimeout(()=>{

      setExpression(
        "normal"
      );

    },350);


    scheduleBlink();

  },
  {passive:false}
);


/* =========================================================
   INITIAL STATE
   ========================================================= */

setExpression(
  "normal"
);

scheduleBlink();


/* =========================================================
   PARENT SOUND TOGGLE
   Long press counter for 3 seconds.
   ========================================================= */

let counterPressTimer = null;


counter.addEventListener(
  "pointerdown",
  e => {

    e.stopPropagation();


    counterPressTimer =
      setTimeout(()=>{

        soundEnabled =
          !soundEnabled;


        setSoundEnabled(
          soundEnabled
        );


        /*
          Gentle vibration for parent
          confirmation.
        */

        vibrate(
          soundEnabled ? 45 : 20
        );


      },3000);

  },
  {passive:false}
);


function cancelCounterLongPress(){

  clearTimeout(
    counterPressTimer
  );

}


counter.addEventListener(
  "pointerup",
  cancelCounterLongPress
);

counter.addEventListener(
  "pointercancel",
  cancelCounterLongPress
);

counter.addEventListener(
  "pointerleave",
  cancelCounterLongPress
);


/* =========================================================
   AUDIO RESUME SAFETY
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      !document.hidden &&
      audioCtx &&
      audioCtx.state ===
      "suspended"
    ){

      audioCtx.resume();

    }

  }
);


/* =========================================================
   DONE
   ========================================================= */

console.log(
  "🐱 बिल्ली मत मारो — Ready!"
);

</script>
